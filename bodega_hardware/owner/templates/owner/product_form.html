{% extends "owner/base.html" %}
{% block title %}{{ title }} · Bodega Hardware{% endblock %}
{% block content %}
<a href="{% url 'owner_stock' %}" class="text-azure underline">Back to your shop</a>
<h1 class="mt-3 text-5xl font-bold text-navy">{{ title }}</h1>
<form method="post" enctype="multipart/form-data" class="mt-8 max-w-2xl rounded-3xl border border-slate-200 bg-white p-8">{% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="mt-6 flex gap-3">
    <button class="rounded-full bg-navy px-8 py-3 text-lg font-semibold text-white hover:bg-steel">Save product</button>
    <a href="{% url 'owner_stock' %}" class="rounded-full bg-slate-200 px-8 py-3 text-lg font-semibold text-navy hover:bg-slate-300">Cancel</a>
  </div>
</form>
{% endblock %}
