<div class="flex flex-wrap items-center justify-between gap-4">
  <h1 class="text-5xl font-bold text-navy">Your shop</h1>
  <a href="{% url 'owner_product_add' %}" class="rounded-full bg-slate-200 px-7 py-3 text-lg font-semibold text-navy hover:bg-slate-300">Add product</a>
</div>

<div class="mt-8 grid gap-4 sm:grid-cols-3">
  <div class="rounded-3xl border border-slate-200 bg-white p-6"><p class="text-5xl font-bold text-navy">{{ product_count }}</p><p class="mt-1 text-xl text-slate-500">Products</p></div>
  <div class="rounded-3xl border border-slate-200 bg-white p-6"><p class="text-5xl font-bold text-navy">{{ low_count }}</p><p class="mt-1 text-xl text-slate-500">Running low</p></div>
  <div class="rounded-3xl border border-slate-200 bg-white p-6"><p class="text-5xl font-bold text-navy">{{ to_fulfil }}</p><p class="mt-1 text-xl text-slate-500">Orders to fulfil</p></div>
</div>

<div class="mt-8 inline-flex rounded-full bg-slate-200 p-1.5 text-lg font-semibold">
  <a href="{% url 'owner_stock' %}" class="rounded-full px-7 py-2.5 {% if tab == 'stock' %}bg-navy text-white{% else %}text-navy{% endif %}">Stock</a>
  <a href="{% url 'owner_orders' %}" class="rounded-full px-7 py-2.5 {% if tab == 'orders' %}bg-navy text-white{% else %}text-navy{% endif %}">Orders ({{ to_fulfil }})</a>
</div>
