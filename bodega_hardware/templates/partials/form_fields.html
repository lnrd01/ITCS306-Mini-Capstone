{{ form.non_field_errors }}
{% for field in form %}
<div class="field mb-4">
  <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-semibold text-navy">{{ field.label }}</label>
  {{ field }}
  {% for error in field.errors %}<p class="mt-1 text-sm text-red-600">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
