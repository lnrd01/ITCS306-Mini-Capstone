{% extends "base.html" %}
{% block title %}Sign up · Bodega Hardware{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-6 py-16">
  <h1 class="mb-6 text-4xl font-bold text-navy">Create your account</h1>
  <form method="post">{% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="w-full rounded-lg bg-navy py-3 text-lg font-semibold text-white hover:bg-steel">Sign up</button>
  </form>
  <p class="mt-5 text-center">Already have an account? <a href="{% url 'login' %}" class="font-semibold text-azure underline">Log in</a></p>
</div>
{% endblock %}
