{% extends "base.html" %}
{% block title %}Log in · Bodega Hardware{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-6 py-16">
  <h1 class="mb-6 text-4xl font-bold text-navy">Log in</h1>
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/form_fields.html" %}
    <button class="w-full rounded-lg bg-navy py-3 text-lg font-semibold text-white hover:bg-steel">Log in</button>
  </form>
  <p class="mt-5 text-center">No account yet? <a href="{% url 'signup' %}" class="font-semibold text-azure underline">Sign up</a></p>
</div>
{% endblock %}
